[package]
name = "jivefetch"
version = "0.0.1"
description = "A local-first media download queue"
authors = ["JiveFetch contributors"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "jivefetch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.5", features = [] }
url = "2.5"
