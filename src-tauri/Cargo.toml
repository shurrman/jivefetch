[package]
name = "jivefetch"
version = "0.3.1"
default-run = "jivefetch"
description = "A local-first media download queue"
authors = ["JiveFetch contributors"]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"

[lib]
name = "jivefetch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
command-group = "5.0.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2"
url = "2.5"

[dev-dependencies]
tempfile = "3.23"
